<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in HTML</title>
    <style>
        .container{
            border: 2px solid black;
            height: 80vh;
            padding: 20px;
            display: grid;
            grid-gap: 20px;
            grid-template-columns: 200px 200px 200px ;
            /* grid-template-columns: repeat(3, 1fr); */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));




            /* grid-template-rows: 200px 200px 200px; */
        }

        .box{
            border: 2px solid black;
            height: 80px;
            width: 80px;
            border-radius: 8px;
        }

        .box4{
            /* grid-column-start: 1;
            grid-column-end: 2; */
            /* grid-row: 5/6;
            grid-column: 3/4; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box box4">4</div>
        <div class="box">5</div>
    </div>

</body>

</html>
