<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation i WebSite</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        nav{
            height: 50px;
            background-color: rgba(0, 0, 0, 0.281);
            width: 100vw;
            display: flex;
            justify-content: space-between;
        }

        nav img{
            height: 40px;
            padding-top: -20px;
            padding: 5px;
            padding-left: 50px;
        }

        nav a{
            text-decoration: none;
            font-size: 25px;
            color: black;
        }

        .right-nav ul li{
            list-style: none;
            text-align: center;
            
        }

        .right-nav ul{
            display: flex;
            gap: 30px;
            padding-right: 30px;
        }

        .right-nav a:hover{
            color: blue;
            border: 1px solid blue;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 4px 4px 8px #0000003f;
        }


    </style>
</head>
<body>
    <header>
        <nav>
            <div class="left-nav">
                <img src="/logo_for_na.png" alt="Logo About My Website">
                <a href=""><span>Nature Beauty</span></a>
            </div>

            <div class="right-nav">
                <ul>
                    <li><a href="/boder.html">Home</a></li>
                    <li><a href="/colour.html">About</a></li>
                    <li><a href="/fonts.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
</body>
</html>
