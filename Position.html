<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        .parent {
            /* display: flex; */
            padding: 20px;
            height: 200vh;
            border: 2px solid black;
            justify-content: center;
        }

        .box {
            /* position: relative; */
            border-radius: 10px;
            height: 20vh;
            width: 10vw;
            border: 2px solid black;
        }

        .box:nth-child(1) {
            background-color: aqua;
        }

        .box:nth-child(2) {
            background-color: aquamarine;
            position: relative;
            top: -100px;
            left: 35px;
        }

        .box:nth-child(2):hover {
            background-color: aquamarine;
            position: relative;
            top: -100px;
            left: 35px;
            z-index: 1;
        }

        .box:nth-child(3) {
            background-color: azure;
            position: relative;
            top: -200px;
            left: 70px;
        }
        .box:nth-child(3):hover {
            background-color: azure;
            position: relative;
            top: -200px;
            left: 70px;
            z-index: 1;
        }

        .box:nth-child(4) {
            background-color: bisque;
            position: relative;
            top: -300px;
            left: 105px;
        }

        .box:nth-child(4):hover {
            background-color: bisque;
            position: relative;
            top: -300px;
            left: 105px;
            z-index: 1;
        }

        .box:nth-child(5){
            background-color: orange;
            position: relative;
            top: -400px;
            left: 140px;
        }

        .box:nth-child(5):hover {
            background-color: orange;
            position: relative;
            top: -400px;
            left: 140px;
            z-index: 1;
        }

        .box:nth-child(6){
            background-color: orangered;
            position: relative;
            top: -500px;
            left: 175px;
        }

        .box:nth-child(6):hover {
            background-color: orangered;
            position: relative;
            top: -500px;
            left: 175px;
            z-index: 1;
        }

        .box:nth-child(7){
            background-color: gold;
            position: relative;
            /* position: fixed; */
            top: -600px;
            left: 210px;
        }

        .box:nth-child(7):hover {
            background-color: gold;
            position: relative;
            top: -600px;
            left: 210px;
            z-index: 1;
        }

        
    </style>
</head>

<body>
    <div class="parent">
        <div class="box"></div>
        <div class="box">Salman</div>
        <div class="box">Huzaifa</div>
        <div class="box">Hanish</div>
        <div class="box">Waseem</div>
        <div class="box">Awais</div>
        <div class="box">Amir</div>
    </div>

</body>

</html>
